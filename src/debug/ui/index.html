<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent LLM Inspector</title>
    <link rel="stylesheet" href="/inspector.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Agent LLM Inspector</h1>
        <p id="statusLine">Connecting…</p>
      </div>
      <div class="controls">
        <button id="liveBtn" type="button" class="active">Live</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="latestBtn" type="button">Voir le plus récent</button>
        <button id="clearBtn" type="button" title="Effacer les calls de cette session de debug (les fichiers JSONL sont conservés)" disabled>Clear</button>
        <span id="newBadge" class="badge hidden">0 nouveaux calls</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>Requests et calls</h2>
          <p class="sidebar-help">Calls dans l’ordre de démarrage. Un call = un appel LLM. Cliquez pour figer la sélection.</p>
          <input
            id="searchInput"
            type="search"
            placeholder="Rechercher…"
            autocomplete="off"
          />
        </div>
        <div id="roundList" class="round-list"></div>
      </aside>

      <section class="detail">
        <div class="detail-head">
          <div class="detail-heading">
            <h2 id="detailTitle">Aucun call sélectionné</h2>
            <p id="detailMeta"></p>
            <p id="detailOutcome"></p>
          </div>
          <button id="copyBtn" type="button" disabled>Copy</button>
        </div>
        <nav class="tabs" id="tabs">
          <button type="button" data-tab="request" class="active">LLM request</button>
          <button type="button" data-tab="response">Response</button>
          <button type="button" data-tab="debug">Debug (local)</button>
        </nav>
        <div id="detailBody" class="detail-body">
          <p class="empty">Sélectionnez un call pour voir la requête LLM exacte.</p>
        </div>
      </section>
    </main>

    <script src="/inspector.js"></script>
  </body>
</html>
